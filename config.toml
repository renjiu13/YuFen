baseURL = "https://1.122915.xyz/"
languageCode = "zh-CN"
title = "人久"
theme = "YuFen"
enableRobotsTXT = true

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[services.rss]
  limit = 20

[pagination]
  pagerSize = 10

[params]
  description = "人久 - 神仙阿旺的个人官网，取人之长久之意，记录技术实践与生活感悟"
  favicon = "/images/20260126_203153.webp"
  # 博客基本信息配置
  blog_title = "人久"           # 博客标题
  author_name = "神仙阿旺"           # 作者姓名
  author_avatar = "/images/20260126_203153.webp"  # 作者头像路径
  author_description = "为人方方正，证心，证我，证自己！"  # 作者简介

  # Giscus 评论系统配置
  [params.giscus]
    enable = true                      # 开启评论功能（必须为true）
    repo = "renjiu13/YuFen"            # 你的GitHub仓库名
    repo_id = "R_kgDORKLlrA"           # 仓库ID（从脚本中提取）
    category = "General"               # Discussion分类名称
    category_id = "DIC_kwDORKLlrM4C2JSz" # 分类ID（从脚本中提取）
    mapping = "pathname"               # URL路径名映射
    strict = "0"                       # 非严格匹配
    reactions_enabled = "1"            # 启用表情反应
    emit_metadata = "1"                # 开启元数据发送（你的脚本中是1，默认是0）
    input_position = "top"             # 评论输入框在顶部（你的脚本中是top，默认是bottom）
    theme = "preferred_color_scheme"   # 跟随浏览器配色方案
    lang = "zh-CN"                     # 评论区语言为简体中文
    loading = "lazy"                   # 懒加载优化性能

[menu]
  [[menu.main]]
    name = "首页"
    url = "/"
    weight = 1

  [[menu.main]]
    name = "文章"
    url = "/posts/"
    weight = 2

  [[menu.main]]
    name = "标签"
    url = "/tags/"
    weight = 3

  [[menu.main]]
    name = "友链"
    url = "/daohang/links/"
    weight = 4

  [[menu.main]]
    name = "关于"
    url = "/daohang/about/"
    weight = 5

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  style = "github"    # 浅色主题，适配白色背景
  noClasses = false

[taxonomies]
  tag = "tags"
